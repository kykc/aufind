[package]
name = "aufind"
version = "0.2.0"
authors = ["kykc"]
edition = "2015"
license = "MIT"
description = "Simple file search with possibility to avoid shell escaping regexes"

[lib]
name = "aufindlib"
path = "src/lib.rs"

[[bin]]
name = "aufind"
path = "src/main.rs"

[dependencies]
walkdir = "*"
regex = "*"
clap = "^2.32"
rustyline = "^4"
colored = "^1.6"
dirs = "*"
ignore = "0.4.22"

[package.metadata.deb]
depends = "libgcc1 (>= 1:6.3.0), libc6 (>= 2.24)"
